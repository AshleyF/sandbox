<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoCo II Emulator</title>
    <style>
        body { background: #222; color: #0f0; font-family: monospace; text-align: center; margin: 2em; }
        canvas { border: 2px solid #0f0; image-rendering: pixelated; background: #000; }
        h1 { font-size: 1.4em; }
        .controls { margin: 1em; }
        button { font-family: monospace; padding: 0.4em 1em; margin: 0.2em; cursor: pointer; }
        #status { margin-top: 1em; font-size: 0.9em; color: #0a0; }
    </style>
</head>
<body>
    <h1>TRS-80 Color Computer II</h1>
    <canvas id="screen" width="256" height="192" style="width:512px;height:384px;"></canvas>
    <div class="controls">
        <button id="loadRom">Load ROM</button>
        <button id="reset">Reset</button>
        <button id="run">Run</button>
        <button id="stop">Stop</button>
        <button id="step">Step</button>
        <span style="color:#555;margin:0 0.5em;">│</span>
        <button id="loadTape">Load Tape</button>
        <button id="recordTape" title="Arm for recording, then type CSAVE">⏺ Record</button>
        <button id="saveTapeCAS">Save CAS</button>
        <button id="saveTapeWAV">Save WAV</button>
        <span style="color:#555;margin:0 0.5em;">│</span>
        <button id="loadCart">Load Cart</button>
        <button id="ejectCart">Eject Cart</button>
        <span style="color:#555;margin:0 0.5em;">│</span>
        <button id="soundToggle">🔇 Sound</button>
        <button id="pasteCode">📋 Paste Code</button>
        <input type="file" id="romFile" accept=".rom,.bin" multiple style="display:none">
        <input type="file" id="tapeFile" accept=".cas,.c10" style="display:none">
        <input type="file" id="cartFile" accept=".rom,.bin,.ccc" style="display:none">
    </div>
    <div id="status">Awaiting ROM...</div>
    <div id="fps" style="position:fixed;top:4px;right:8px;color:#555;font-size:11px;font-family:monospace;"></div>
    <div style="display:flex;justify-content:center;gap:2em;margin-top:0.5em;">
        <div id="tape-status" style="font-size:0.85em;color:#888;">
            <span id="tape-label">🎵 Tape: empty</span>
            <span id="tape-motor" style="margin-left:1em;">⏹ Motor off</span>
            <span id="tape-signal" style="margin-left:1em;">Signal: ─</span>
            <div style="margin-top:0.3em;">
                <span style="color:#555;">[</span><span id="tape-bar" style="color:#0f0;letter-spacing:-1px;">░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░</span><span style="color:#555;">]</span>
                <span id="tape-pct" style="margin-left:0.5em;color:#666;">0%</span>
            </div>
        </div>
        <div id="joystick-status" style="font-size:0.85em;color:#888;text-align:center;">
            <div>🕹 Joystick (IJKL + Tab)</div>
            <canvas id="joystick-display" width="80" height="80" style="border:1px solid #444;margin-top:0.3em;background:#111;"></canvas>
            <div id="joystick-pos" style="color:#666;font-size:0.75em;">X:31 Y:31</div>
        </div>
    </div>
    <pre id="debug" style="text-align:left;display:inline-block;font-size:11px;color:#0a0;margin-top:1em;"></pre>
    <script type="module" src="coco.js"></script>
</body>
</html>
